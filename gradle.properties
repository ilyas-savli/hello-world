org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Base package used by convention plugins to derive each module's namespace.
app.package=com.ilyassavli.helloworld

# Release identity. Migrate: the old app's applicationId (it may differ from the package above) and a versionCode above
# the old app's, or the update won't install over it (check_rules MIG-01 compares them with SPEC.md).
app.applicationId=com.ilyassavli.helloworld
app.versionCode=1
app.versionName=1.0.0

# API configuration per environment flavor (ENV-01). Real/secret values belong in ~/.gradle/gradle.properties or CI.
api.stage.baseUrl=https://localhost/
api.prod.baseUrl=https://localhost/
# Comma-separated sha256/... pins (current intermediate + root, plus backup roots — HARD-01). Empty = pinning off.
api.stage.certPins=
api.prod.certPins=

# ci:firebase-begin — Firebase App Distribution app id (not secret; Firebase console → Project settings)
firebase.stage.appId=1:422635998883:android:1c404fa011beaaa91db916
# ci:firebase-end
