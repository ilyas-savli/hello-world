# Dependency vulnerability scan (HARD-08, CI-03). Secret: NVD_API_KEY (free key from nvd.nist.gov).
name: Dependency scan

on:
  pull_request:
    paths: ['gradle/libs.versions.toml', '**/build.gradle.kts']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  owasp:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest becomes 26.04 in Nov 2026; bump on purpose
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: OWASP dependency-check
        run: ./gradlew dependencyCheckAggregate -PnvdApiKey=${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
