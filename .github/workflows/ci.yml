# PR gate (CI-01): build, static analysis, tests and coverage on every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest becomes 26.04 in Nov 2026; bump on purpose
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, lint, test, coverage
        run: ./gradlew assembleDebug detekt ktlintCheck lint testDebugUnitTest testStageDebugUnitTest koverVerify --continue
      - name: Project rule scan
        run: python3 tools/check_rules.py .
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
